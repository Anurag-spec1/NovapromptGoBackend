services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://nova:nova@postgres:5432/nova?sslmode=disable",
      "up"
    ]

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://nova:nova@postgres:5432/nova?sslmode=disable"
      DB_MAX_CONNS: "20"
      DB_MIN_CONNS: "2"
    ports:
      - "8080:8080"

volumes:
  pgdata: